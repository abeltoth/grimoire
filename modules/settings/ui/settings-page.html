<gr-general-settings />
<gr-page-tab-settings />
<gr-quick-model-settings />
@for (section of shell.settingsSections.all(); track section.id) {
  @if ((section.load | loaded)(); as component) {
    <ng-container *ngComponentOutlet="component" />
  }
}
<gr-preset-settings />

<section class="theme" aria-labelledby="gr-settings-theme">
  <h2 id="gr-settings-theme">{{ wording.say('The theme', 'Theme') }}</h2>
  <gr-theme-editor />
</section>

<gr-profile-settings />
