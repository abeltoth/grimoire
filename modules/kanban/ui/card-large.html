<dialog
  #dialog
  class="large"
  aria-label="The card, enlarged"
  (click)="closeBeside($event)"
  (close)="shown.set(null)"
>
  @if (card(); as card) {
    <div class="slip">
      @if (card.jira; as issue) {
        <p class="key">{{ issue.key }}</p>
      }
      <h2 class="title">{{ card.title }}</h2>
      @if (card.notes) {
        <p class="notes">{{ card.notes }}</p>
      }
    </div>
  }
</dialog>
