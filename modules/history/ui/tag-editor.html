@for (tag of tags(); track tag) {
  <span class="tag"
    >{{ tag
    }}<button
      type="button"
      class="untag"
      [attr.aria-label]="'Remove tag ' + tag"
      (click)="remove(tag)"
    >
      <gr-icon name="close" /></button
  ></span>
}
@if (adding()) {
  <input
    #field
    class="field"
    aria-label="New tag"
    placeholder="tag"
    autocomplete="off"
    spellcheck="false"
    [attr.list]="listId"
    (keydown.enter)="finish(field, true, true)"
    (keydown.escape)="$event.preventDefault(); finish(field, false, true)"
    (blur)="finish(field, true, false)"
  />
  <datalist [id]="listId">
    @for (tag of suggestions(); track tag) {
      <option [value]="tag"></option>
    }
  </datalist>
} @else {
  <span class="add-at">
    <button #addButton type="button" class="gr-link add" (click)="adding.set(true)">+ Tag</button>
  </span>
}
