@if (tips().length) {
  <aside class="tips" [attr.aria-label]="agent().name + '’s tips'">
    <h4>{{ agent().name }}’s tips</h4>
    <ul>
      @for (tip of tips(); track tip.key) {
        <li>
          <span class="advice">
            <span class="advice-title">{{ tip.title }}</span>
            @if (tip.command) {
              <code>{{ tip.command }}</code>
            }
          </span>
          @if (tip.why) {
            <span class="advice-why">{{ tip.why }}</span>
          }
        </li>
      }
    </ul>
  </aside>
}
