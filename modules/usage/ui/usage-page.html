<div class="tabs" role="tablist" [attr.aria-label]="wording.say('Ledger', 'Usage')">
  @for (each of views; track each[0]) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="view() === each[0]"
      (click)="view.set(each[0])"
    >
      {{ each[1] }}
    </button>
  }
</div>

<gr-usage-limits [shown]="view() === 'limits'" />
<gr-usage-tokens [view]="view()" />
