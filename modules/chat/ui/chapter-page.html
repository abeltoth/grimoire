@if (chapter(); as c) {
  <gr-dog-ears [chapter]="c" />
  <gr-running-head>
    <div class="row">
      <h1 class="title" [class.untitled]="!c.title">{{ c.title || 'Untitled chapter' }}</h1>
      <button type="button" class="icon-button" aria-label="Rename chapter" aria-disabled="true">
        <gr-icon name="pen" />
      </button>
      <button type="button" class="gr-link" aria-disabled="true">+ Tag</button>
    </div>
    <div class="row">
      <div class="meta" role="group" aria-label="Chapter settings">
        @for (setting of settings(); track setting.key; let first = $first) {
          @if (!first) {
            <span aria-hidden="true">·</span>
          }
          <button
            #setting
            type="button"
            [attr.data-setting]="setting.key"
            [class.on]="card()?.on === setting.key"
            aria-haspopup="dialog"
            [attr.aria-expanded]="card()?.on === setting.key"
            (click)="toggle(setting.key)"
          >
            {{ setting.label }}
          </button>
        }
      </div>
      <span class="spacer"></span>
      <button type="button" class="gr-link" aria-disabled="true">
        <gr-icon name="pop-out" />Pop out
      </button>
      <button type="button" class="gr-link" (click)="chats.close(c.id)">Close</button>
    </div>
  </gr-running-head>

  @if (card(); as open) {
    <gr-settings-card [chapter]="c" [on]="open.on" [anchor]="anchorFor(open.on)" />
  }

  @if (c.status === 'blank') {
    <gr-chapter-opening
      [agentName]="chats.agentName(c.agent)"
      [cwd]="c.settings.cwd"
      [mode]="c.settings.mode"
      [begunAt]="c.begunAt ?? 0"
      [error]="c.error"
    />
  } @else {
    <gr-transcript [chapter]="c" (stop)="stop()" />
  }
  <gr-composer
    [chapterId]="c.id"
    [agent]="c.agent"
    [cwd]="c.settings.cwd"
    [first]="c.status === 'blank'"
    [queued]="c.queued"
    [context]="c.context"
  />

  <gr-running-foot>
    <gr-status-indicators />
    <span class="spacer"></span>
    <div class="edition" role="group" aria-label="Edition: transcript detail">
      <button type="button" aria-pressed="true">Plain</button>
      <span aria-hidden="true">·</span>
      <button type="button" aria-pressed="false" aria-disabled="true">Annotated</button>
      <span aria-hidden="true">·</span>
      <button type="button" aria-pressed="false" aria-disabled="true">Variorum</button>
    </div>
  </gr-running-foot>
}
