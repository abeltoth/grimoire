@if (chapter(); as c) {
  <gr-dog-ears [chapter]="c" />
  <gr-running-head>
    <div class="row">
      @if (renaming()) {
        <input
          #titleField
          class="title rename"
          [attr.aria-label]="wording.say('Chapter title', 'Chat title')"
          [placeholder]="wording.untitled()"
          [value]="c.title"
          (keydown.enter)="finishRenaming(titleField, true, true)"
          (keydown.escape)="$event.preventDefault(); finishRenaming(titleField, false, true)"
          (blur)="finishRenaming(titleField, true, false)"
        />
      } @else {
        <h1 class="title" [class.untitled]="!c.title" [attr.title]="c.title || null">
          {{ c.title || wording.untitled() }}
        </h1>
        @if (canRename()) {
          <button
            #renameButton
            type="button"
            class="icon-button"
            [attr.aria-label]="wording.say('Rename chapter', 'Rename chat')"
            (click)="renaming.set(true)"
          >
            <gr-icon name="pen" />
          </button>
        }
      }
      <gr-chapter-tags [chapter]="c" />
      <gr-review-stamps />
    </div>
    <div class="row">
      <div
        class="meta"
        role="group"
        [attr.aria-label]="wording.say('Chapter settings', 'Chat settings')"
      >
        @for (setting of settings(); track setting.key; let first = $first) {
          @if (!first) {
            <span aria-hidden="true">·</span>
          }
          <button
            #setting
            type="button"
            [attr.data-setting]="setting.key"
            [class.on]="card()?.on === setting.key"
            aria-haspopup="dialog"
            [attr.aria-expanded]="card()?.on === setting.key"
            (click)="toggle(setting.key)"
          >
            {{ setting.label }}
          </button>
        }
      </div>
      <span class="spacer"></span>
      <button type="button" class="gr-link" aria-disabled="true">
        <gr-icon name="pop-out" />Pop out
      </button>
      <button type="button" class="gr-link" (click)="chats.close(c.id)">Close</button>
    </div>
  </gr-running-head>

  @if (card(); as open) {
    <gr-settings-card [chapter]="c" [on]="open.on" [anchor]="anchorFor(open.on)" />
  }

  @if (c.status === 'blank') {
    <gr-chapter-opening
      [agentName]="chats.agentName(c.agent)"
      [cwd]="c.settings.cwd"
      [worktree]="!!c.settings.worktree"
      [mode]="c.settings.mode"
      [begunAt]="c.begunAt ?? 0"
      [error]="c.error"
    />
  } @else {
    <gr-transcript [chapter]="c" (stop)="stop()" />
  }
  <gr-composer
    [chapterId]="c.id"
    [agent]="c.agent"
    [cwd]="c.settings.cwd"
    [first]="c.status === 'blank'"
    [queued]="c.queued"
    [context]="c.context"
    [cache]="c.status === 'idle' ? c.cache : undefined"
    [sent]="sent()"
  />

  <gr-running-foot>
    <gr-status-indicators />
    <span class="spacer"></span>
    <div
      class="edition"
      role="group"
      [attr.aria-label]="wording.say('Edition: transcript detail', 'Transcript detail')"
    >
      <button type="button" aria-pressed="true">{{ wording.say('Plain', 'Normal') }}</button>
      <span aria-hidden="true">·</span>
      <button type="button" aria-pressed="false" aria-disabled="true">
        {{ wording.say('Annotated', 'Thinking') }}
      </button>
      <span aria-hidden="true">·</span>
      <button type="button" aria-pressed="false" aria-disabled="true">
        {{ wording.say('Variorum', 'Verbose') }}
      </button>
    </div>
  </gr-running-foot>
}
