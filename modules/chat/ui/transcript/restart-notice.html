<div
  class="slip"
  role="status"
  [attr.title]="
    wording.say(
      'The chapter takes it in once it starts again',
      'The chat loads it once it restarts'
    )
  "
>
  <span class="what">{{ outdated() }}</span>
  <button type="button" class="restart" (click)="actions.restart(chatId())">Restart</button>
  <button
    type="button"
    class="dismiss"
    aria-label="Dismiss"
    title="Dismiss"
    (click)="actions.dismissRestart(chatId())"
  >
    <gr-icon name="close" />
  </button>
</div>
