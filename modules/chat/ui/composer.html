<label class="sr-only" for="gr-next-entry">Next entry</label>
<textarea
  #entry
  id="gr-next-entry"
  class="entry"
  rows="2"
  placeholder="Write the next entry…"
  [value]="draft()"
  (input)="draft.set($any($event.target).value)"
  (keydown.enter)="enter($event, entry)"
></textarea>

<div class="controls">
  <button
    type="button"
    class="control"
    aria-label="Attach files or a screenshot"
    aria-disabled="true"
  >
    <gr-icon name="attach" />Attach
  </button>
  <span class="spacer"></span>
  <button
    type="button"
    class="control"
    aria-label="Parallel texts: send to two models on facing pages"
    aria-disabled="true"
  >
    <gr-icon name="parallel" />Parallel
  </button>
  <button type="button" class="send" (click)="send(entry)">
    Send <span class="gr-kbd">⏎</span>
  </button>
</div>
