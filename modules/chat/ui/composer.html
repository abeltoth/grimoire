@for (waiting of queued(); track waiting.id) {
  <div class="queued">
    <span class="queued-label"><gr-icon name="hourglass" />Queued</span>
    <p class="queued-text">{{ waiting.text }}</p>
    <span class="queued-when">sends when this turn ends</span>
    <button type="button" class="gr-link" (click)="edit(waiting)">Edit</button>
    <button type="button" class="gr-link" (click)="remove(waiting)">Remove</button>
  </div>
}

<label class="sr-only" for="gr-next-entry">{{ first() ? 'First entry' : 'Next entry' }}</label>
<textarea
  #entry
  id="gr-next-entry"
  class="entry"
  rows="2"
  [placeholder]="first() ? 'Write the first entry…' : 'Write the next entry…'"
  [value]="draft()"
  (input)="draft.set($any($event.target).value)"
  (keydown.enter)="enter($event, entry)"
></textarea>

<div class="controls">
  <button
    type="button"
    class="control"
    aria-label="Attach files or a screenshot"
    aria-disabled="true"
  >
    <gr-icon name="attach" />Attach
  </button>
  <span class="spacer"></span>
  @if (used() !== undefined) {
    <div
      class="allowance"
      role="meter"
      aria-label="Context window used"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="used()"
    >
      <span class="ticks" aria-hidden="true">
        <span class="used" [style.width.%]="used()! > 100 ? 100 : used()"></span>
      </span>
      <b>{{ used() }}%</b>
      <span>of the chapter’s page allowance</span>
    </div>
  }
  <button
    type="button"
    class="control"
    aria-label="Parallel texts: send to two models on facing pages"
    aria-disabled="true"
  >
    <gr-icon name="parallel" />Parallel
  </button>
  <button type="button" class="send" (click)="send(entry)">
    Send <span class="gr-kbd">⏎</span>
  </button>
</div>
