<span class="ticks" aria-hidden="true">
  <span class="used" [style.width.%]="share() > 100 ? 100 : share()"></span>
</span>
<b>{{ share() }}%</b>
<span class="count">{{ count() }}</span>
<span>{{
  context().compactsAt
    ? wording.say('before the chapter is summed up', 'before auto-compact')
    : wording.say('of the chapter’s page allowance', 'of the context window')
}}</span>
