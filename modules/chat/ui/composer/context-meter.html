<button
  #gauge
  type="button"
  class="gauge"
  [class.fixed]="!!context().fixed"
  [attr.aria-haspopup]="context().fixed ? null : 'dialog'"
  [attr.aria-expanded]="context().fixed ? null : open()"
  [attr.aria-label]="label()"
  [attr.title]="detail()"
  (click)="context().fixed || open.set(!open())"
>
  <span class="ticks" aria-hidden="true">
    <span class="used" [style.width.%]="share() > 100 ? 100 : share()"></span>
  </span>
  <b>{{ share() }}%</b>
  <span class="count">{{ count() }}</span>
  @if (!context().compactsAt) {
    <span>{{ wording.say('of the chapter’s page allowance', 'of the context window') }}</span>
  }
</button>
@if (open() && !context().fixed) {
  <gr-compaction-card
    [chatId]="chatId()"
    [agent]="agent()"
    [context]="context()"
    [anchor]="gauge"
    (closed)="open.set(false)"
  />
}
