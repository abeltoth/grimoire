<button
  type="button"
  class="flat"
  [attr.aria-current]="current() ? 'page' : null"
  [attr.aria-expanded]="expanded() ?? null"
  [attr.aria-label]="label() ?? null"
  [attr.aria-disabled]="unavailable() || null"
  (click)="pick()"
  (auxclick)="auxClick($event)"
  (contextmenu)="contextMenu($event)"
>
  <ng-content />
  <span class="text">
    <b>{{ heading() }}</b>
    <i>{{ meta() }}</i>
  </span>
</button>
<span class="root" aria-hidden="true">
  <span class="drop"></span>
  <span class="crease"></span>
</span>
@if (motes()) {
  <span class="mote mote-1" aria-hidden="true"></span>
  <span class="mote mote-2" aria-hidden="true"></span>
  <span class="mote mote-3" aria-hidden="true"></span>
}
@if (seal()) {
  <span class="seal" aria-hidden="true">{{ seal() }}</span>
}
