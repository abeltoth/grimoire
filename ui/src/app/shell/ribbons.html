<div class="half left-half">
  @for (chapter of left(); track chapter.id) {
    <gr-ribbon
      class="chapter"
      side="left"
      [tone]="tone(chapter)"
      [current]="chapter.id === chapters.currentId()"
      [heading]="title(chapter)"
      [meta]="meta(chapter)"
      (picked)="chapters.open(chapter.id)"
      (dismissed)="chapters.close(chapter.id)"
      (settings)="chapters.openSettings(chapter.id, 'agent')"
    >
      <gr-icon [name]="icon(chapter)" [class]="motion(chapter)" />
    </gr-ribbon>
  }
</div>

<div class="half right-half">
  @for (chapter of right(); track chapter.id) {
    <!-- Nearest the spine lies on top, as on the left. -->
    <gr-ribbon
      class="chapter"
      side="right"
      [style.--stack]="right().length - $index"
      [tone]="tone(chapter)"
      [heading]="title(chapter)"
      [meta]="meta(chapter)"
      (picked)="chapters.open(chapter.id)"
      (dismissed)="chapters.close(chapter.id)"
      (settings)="chapters.openSettings(chapter.id, 'agent')"
    >
      <gr-icon [name]="icon(chapter)" [class]="motion(chapter)" />
    </gr-ribbon>
  }

  @if (seals()) {
    <gr-ribbon
      class="seals"
      side="right"
      tone="seal"
      heading="Awaiting your seal"
      [meta]="sealMeta()"
      [label]="sealLabel()"
      [seal]="seals()"
      [expanded]="facing.seals()"
      (picked)="facing.seals() ? facing.closeSeals() : facing.openSeals()"
    />
  }

  @let shortcut = newChapter()?.shortcut;
  <gr-ribbon
    class="new"
    side="right"
    tone="new"
    heading="New chapter"
    [meta]="'Last settings' + (shortcut ? ' · ' + (shortcut | shortcut) : '')"
    (picked)="chapters.newChapter()"
  >
    <gr-icon name="plus" />
  </gr-ribbon>
</div>
