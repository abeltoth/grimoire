<!-- On a Mac the system's window buttons sit in this corner. -->
<div class="side"></div>

<div class="title">
  <button
    type="button"
    class="window-title"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="label()"
    (click)="toggle()"
  >
    {{ name() }}<gr-icon name="chevron-down" />
  </button>

  @if (open() || profiles.refused()) {
    <div class="menu">
      @if (profiles.refused(); as reason) {
        <p class="refused" role="alert">
          {{ reason }}
          <button type="button" class="gr-link" (click)="profiles.refused.set(null)">Dismiss</button>
        </p>
      }
      @if (open()) {
        <div role="menu" [attr.aria-label]="wording.say('Volumes', 'Profiles')">
          @for (profile of profiles.list().profiles; track profile.id) {
            <button
              type="button"
              class="item"
              role="menuitemradio"
              [attr.aria-checked]="profile.id === profiles.list().active"
              (click)="pick(profile.id)"
            >
              {{ profile.name }}
            </button>
          }
          <button type="button" class="item manage" role="menuitem" (click)="manage()">
            Manage…
          </button>
        </div>
      }
    </div>
  }
</div>

<div class="side end">
  <gr-window-controls />
</div>
