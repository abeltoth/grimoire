@for (tab of registry.thumbs.all(); track tab.id) {
  <button
    type="button"
    class="thumb"
    [attr.title]="tab.label"
    [attr.aria-current]="facing.thumb() === tab.id ? 'page' : null"
    (click)="facing.thumb() === tab.id ? facing.closeThumb() : facing.openThumb(tab.id)"
  >
    <span>{{ tab.label }}</span>
  </button>
}

@let shortcut = index()?.shortcut;
<button
  type="button"
  class="thumb index"
  [attr.aria-label]="
    'Index, the command palette' + (shortcut ? '. ' + (shortcut | shortcut: 'spoken') : '')
  "
  [attr.aria-current]="facing.index() !== null ? 'page' : null"
  (click)="index()?.run?.()"
>
  <span>
    Index
    @if (shortcut) {
      <span class="gr-kbd" [class.words]="platform !== 'mac'">{{
        shortcut | shortcut: 'keys'
      }}</span>
    }
  </span>
</button>
