@if (!bare()) {
  <gr-title-strip />
}

<div class="stage">
  @if (bare()) {
    <!-- The desk either side of the page drags the window; on a Mac its buttons sit in this corner. -->
    <div class="desk" aria-hidden="true"></div>
  }
  <gr-book [bare]="bare()" [single]="single()">
    <gr-page
      side="left"
      [alone]="single()"
      [attr.aria-label]="
        wording.say('Chapter: ', 'Chat: ') + (chapters.current()?.title || wording.untitled())
      "
    >
      @if (commandsHere()) {
        <gr-command-index [backTo]="wording.say('chapter', 'chat')" />
      } @else if (registry.chapterPage(); as chapterPage) {
        <ng-container *ngComponentOutlet="chapterPage" />
      } @else {
        <div class="chapter"></div>
        <gr-running-foot><gr-status-indicators /></gr-running-foot>
      }
    </gr-page>
    @if (!single()) {
      <gr-facing-page />
    }
    @if (!bare()) {
      <gr-thumb-index />
    }
  </gr-book>
  @if (bare()) {
    <div class="desk end"><gr-window-controls /></div>
  } @else {
    <gr-ribbons />
  }
</div>
