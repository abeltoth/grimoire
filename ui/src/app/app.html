<gr-title-strip [profile]="profile" />

<div class="stage">
  <gr-book>
    <gr-page
      side="left"
      [attr.aria-label]="
        wording.say('Chapter: ', 'Chat: ') + (chapters.current()?.title || wording.untitled())
      "
    >
      @if (registry.chapterPage(); as chapterPage) {
        <ng-container *ngComponentOutlet="chapterPage" />
      } @else {
        <div class="chapter"></div>
        <gr-running-foot><gr-status-indicators /></gr-running-foot>
      }
    </gr-page>
    <gr-facing-page />
    <gr-thumb-index />
  </gr-book>
  <gr-ribbons />
</div>
