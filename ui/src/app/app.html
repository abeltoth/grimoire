@if (!bare()) {
  <gr-title-bar />
}

<div class="stage">
  @if (bare()) {
    <!-- The desk either side of the page drags the window; on a Mac its buttons sit in this corner. -->
    <div class="desk" aria-hidden="true"></div>
  }
  <gr-frame [bare]="bare()" [single]="single()">
    <gr-page
      side="left"
      [alone]="single()"
      [attr.aria-label]="
        wording.say('Chapter: ', 'Chat: ') + (list.current()?.title || wording.untitled())
      "
    >
      @if (commandsHere()) {
        <gr-slash-commands [backTo]="wording.say('chapter', 'chat')" />
      } @else if (registry.chatPage(); as chatPage) {
        <ng-container *ngComponentOutlet="chatPage" />
      } @else {
        <div class="chat"></div>
        <gr-page-footer><gr-status-indicators /></gr-page-footer>
      }
    </gr-page>
    @if (!single()) {
      <gr-right-page />
    }
    @if (!bare()) {
      <gr-page-tabs />
    }
  </gr-frame>
  @if (bare()) {
    <div class="desk end"><gr-window-controls /></div>
  } @else {
    <gr-chat-tabs />
  }
</div>
