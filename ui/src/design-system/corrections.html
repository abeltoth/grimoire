<div class="head">
  <b>{{ file() }}</b>
  <span class="detail">corrections, {{ caption() }}</span>
  <span class="spacer"></span>
  <span class="detail">+{{ inserted() }} −{{ removed() }}</span>
  @if (openable()) {
    <button type="button" class="gr-link" (click)="open.emit()">Open in Files</button>
  }
</div>
<div class="body" tabindex="0">
  @for (line of marked(); track line.key) {
    <div
      class="line"
      [class.removed]="line.kind === 'removed'"
      [class.inserted]="line.kind === 'inserted'"
      [class.break]="line.break"
    >
      <span class="number">{{ line.kind === 'inserted' ? '‸' : '' }}</span>
      <span class="code">{{ line.text }}</span>
      <span class="mark">{{ line.mark }}</span>
    </div>
  }
</div>
<div class="foot">
  <span class="spacer"></span>
  <span>struck: removed · ‸ inserted</span>
</div>
