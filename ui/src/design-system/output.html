<div class="head">
  <b>{{ title() }}</b>
  <span class="detail">{{ running() ? 'what it was asked' : 'output' }}</span>
</div>
@if (commandLines().length) {
  <div class="command" tabindex="0" aria-label="Command">
    @for (line of commandLines(); track $index) {
      <div class="line">
        <span class="number">{{ $first ? '$' : '' }}</span>
        <span class="code">{{ line }}</span>
        <span class="mark"></span>
      </div>
    }
  </div>
}
<div class="body" tabindex="0">
  @for (line of lines(); track $index) {
    <div class="line">
      <span class="number"></span>
      <span class="code">{{ line }}</span>
      <span class="mark"></span>
    </div>
  }
  @if (running()) {
    <div class="line">
      <span class="number"></span>
      <span class="code running">running…</span>
      <span class="mark"></span>
    </div>
  }
</div>
