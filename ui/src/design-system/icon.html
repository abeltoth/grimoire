@switch (name()) {
  @case ('quill') {
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    >
      <path d="M3 21l7-7M10 14c1-5 4-9 11-11-1 7-5 10-11 11zM12 12l5-5" />
    </svg>
  }
  @case ('bell') {
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M6 16.5h12l-1.6-2.2V10a4.4 4.4 0 0 0-8.8 0v4.3z" />
      <path d="M10.2 19.2a1.9 1.9 0 0 0 3.6 0" />
    </svg>
  }
  @case ('circle') {
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.4"
    >
      <circle cx="12" cy="12" r="9" stroke-dasharray="2.4 2.6" />
      <path d="M12 5.5l1.9 4.6 4.6 1.9-4.6 1.9L12 18.5l-1.9-4.6L5.5 12l4.6-1.9z" />
    </svg>
  }
  @case ('moon') {
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path d="M15.5 3.5a8.5 8.5 0 1 0 5 14.6A7.2 7.2 0 0 1 15.5 3.5z" />
    </svg>
  }
  @case ('page') {
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linejoin="round"
    >
      <path d="M6 3h12v18H6z" />
    </svg>
  }
  @case ('plus') {
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
  }
  @case ('branch') {
    <svg
      width="13"
      height="13"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
    >
      <circle cx="6" cy="5" r="2.2" />
      <circle cx="6" cy="19" r="2.2" />
      <circle cx="18" cy="8" r="2.2" />
      <path d="M6 7.2v9.6M18 10.2c0 4-6 3.5-11 6.8" />
    </svg>
  }
  @case ('chevron-down') {
    <svg
      width="10"
      height="10"
      viewBox="0 0 10 10"
      fill="none"
      stroke="currentColor"
      stroke-width="1.4"
    >
      <path d="M2 3.5l3 3 3-3" />
    </svg>
  }
  @case ('single-page') {
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path d="M6 3.5h12v17H6z" />
    </svg>
  }
  @case ('minimize') {
    <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor">
      <path d="M0 5.5h10" />
    </svg>
  }
  @case ('maximize') {
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor">
      <rect x=".5" y=".5" width="9" height="9" />
    </svg>
  }
  @case ('close') {
    <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor">
      <path d="M0 0l10 10M10 0L0 10" />
    </svg>
  }
}
